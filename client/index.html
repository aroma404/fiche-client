<!doctype html>
<html lang="fr">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Fiche Client Impôt</title>
    <meta name="description" content="Atelier fiscal temporaire, confidentiel et imprimable." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      #app-boot-shell { min-height: 100vh; background: #f6f5f0; color: #102a43; font-family: Arial, sans-serif; }
      .boot-top { height: 72px; border-top: 3px solid #c99a3e; border-bottom: 1px solid #d7e0df; display: flex; align-items: center; padding: 0 8%; }
      .boot-line { display: block; border-radius: 8px; background: #dfe9e5; }
      .boot-main { padding: 48px 8%; max-width: 1180px; }
      .boot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 42px; }
      .boot-card { height: 150px; border: 1px solid #d7e0df; border-radius: 16px; background: #fff; }
      @media (max-width: 700px) { .boot-main { padding: 32px 20px; } .boot-grid { grid-template-columns: 1fr; } }
    </style>
  </head>

  <body>
    <div id="app-boot-shell" aria-hidden="true"><div class="boot-top"><span class="boot-line" style="width:150px;height:15px"></span></div><main class="boot-main"><span class="boot-line" style="width:130px;height:12px"></span><span class="boot-line" style="width:52%;height:44px;margin-top:20px"></span><span class="boot-line" style="width:80%;height:15px;margin-top:16px"></span><div class="boot-grid"><div class="boot-card"></div><div class="boot-card"></div><div class="boot-card"></div></div></main></div><div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
